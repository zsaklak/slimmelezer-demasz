      name: "Hatásos import energia tarifa 1"
    energy_delivered_tariff2:
      name: "Hatásos import energia tarifa 2"
    energy_delivered_tariff3:
      name: "Hatásos import energia tarifa 3"
    energy_delivered_tariff4:
      name: "Hatásos import energia tarifa 4"

    energy_returned_lux:
      name: "Hatásos export energia összesen"
    energy_returned_tariff1:
      name: "Hatásos export energia tarifa 1"
    energy_returned_tariff2:
      name: "Hatásos export energia tarifa 2"
    energy_returned_tariff3:
      name: "Hatásos export energia tarifa 3"
    energy_returned_tariff4:
      name: "Hatásos export energia tarifa 4"

    total_imported_energy:
      name: "Meddő import energia összesen"
    total_exported_energy:
      name: "Meddő export energia összesen"

    power_delivered:
      name: "Pillanatnyi aktív import teljesítmény"
    power_returned:
      name: "Pillanatnyi aktív export teljesítmény"

    electricity_threshold:
      name: "Limiter határérték"

    voltage_l1:
      name: "Feszültség L1"
    voltage_l2:
      name: "Feszültség L2"
    voltage_l3:
      name: "Feszültség L3"

    current_l1:
      name: "Áramerősség L1"
    current_l2:
      name: "Áramerősség L2"
    current_l3:
      name: "Áramerősség L3"

    current_fuse_l1:
      name: "Biztosító áramhatár L1"
    current_fuse_l2:
      name: "Biztosító áramhatár L2"
    current_fuse_l3:
      name: "Biztosító áramhatár L3"

    power_delivered_l1:
      name: "Aktív import teljesítmény L1"
    power_delivered_l2:
