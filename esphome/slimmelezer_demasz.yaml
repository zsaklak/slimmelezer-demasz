---
substitutions:
  device_name: slimmelezer
  friendly_name: "SlimmeLezer Démász"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: zsaklak.slimmelezer_demasz
    version: "1.0.0"

  # NINCS HASZNÁLATBAN: a Démász P1 telegram nincs titkosítva.
  # Az eredeti generikus SlimmeLezer konfiguráció on_boot decryption-key
  # visszatöltése ezért szándékosan nincs engedélyezve.
  # on_boot:
  #   then:
  #     - if:
  #         condition:
  #           lambda: return id(has_key);
  #         then:
  #           - lambda: |-
  #               std::string key(id(stored_decryption_key), 32);
  #               id(dsmr_instance).set_decryption_key(key);
  #         else:
  #           - logger.log:
  #               level: info
  #               format: "A DSMR titkosítás nincs használatban."

esp8266:
  board: d1_mini
  restore_from_flash: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name}
  # A P1 port korlátozott tápellátása miatt.
  output_power: 14dB

captive_portal:

logger:
  # A hardveres UART maradjon szabad a D7/GPIO13 P1 vételhez.
  baud_rate: 0

api:
  # NINCS HASZNÁLATBAN: titkosítatlan telegramhoz nem kell set_dsmr_key
  # szolgáltatás. A teljes eredeti api.services blokk ezért ki van kapcsolva.
  # services:
  #   service: set_dsmr_key
  #   variables:
  #     private_key: string
  #   then:
  #     - logger.log:
  #         format: "DSMR privát kulcs beállítása"
  #     - globals.set:
  #         id: has_key
  #         value: !lambda "return private_key.length() == 32;"
  #     - lambda: |-
  #         if (private_key.length() == 32)
  #           private_key.copy(id(stored_decryption_key), 32);
  #         id(dsmr_instance).set_decryption_key(private_key);

# NINCS HASZNÁLATBAN: a kész, mérőspecifikus konfigurációt nem írhatja felül
# a Zuidwijk általános dashboard-importja.
# dashboard_import:
#   package_import_url: github://zuidwijk/dsmr/slimmelezer.yaml@main
#   import_full_config: true

ota:
  - platform: esphome

web_server:
  port: 80
  version: "3"
  # A Raw DSMR Telegram ne kerüljön HA-entitásállapotba, de a helyi
  # /text_sensor/raw_dsmr_telegram REST-végponton legyen elérhető.
  include_internal: true

uart:
  baud_rate: 115200
  rx_pin: D7
  rx_buffer_size: 1700

dsmr:
  id: dsmr_instance
  max_telegram_length: 1700
  # NINCS HASZNÁLATBAN: a Démász telegram titkosítatlan.
  # decryption_key: !secret decryption_key

# NINCS HASZNÁLATBAN: csak a titkosítási kulcs tárolásához kellettek.
# globals:
#   - id: has_key
#     type: bool
#     restore_value: true
#     initial_value: "false"
#   - id: stored_decryption_key
#     type: char[32]
#     restore_value: true

sensor:
  # Ezeket a diagnosztikai szenzorokat a korábbi SlimmeLezer-konfiguráció is
  # publikálta. A nevük szándékosan változatlan, így egy következő firmware-
  # telepítés után a történeti Home Assistant-entitások újra felélednek.
  - platform: uptime
    name: "SlimmeLezer Uptime"
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "SlimmeLezer Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

