    electricity_tariff:
      name: "Aktuális tarifa"
    electricity_switch_position:
      name: "Megszakító állapota"
    # Az üres 0-0:96.13.0() is érvényes hosszú üzenet.
    message_long:
      name: "Áramszolgáltatói hosszú üzenet"

    # Az ESPHome equipment_id mezője 0-0:96.1.1-et vár, de a vizsgált mérő
    # 0-0:96.1.0-t küld. Ezt a dinamikus HA-integráció dolgozza fel.
