    # NINCS AZ AKTUÁLIS TELEGRAMBAN, ezért szándékosan kikapcsolva:
    # frequency:
    #   name: "Hálózati frekvencia"

    # A MÉRŐ MÁSIK OBIS-KÓDOKAT KÜLD, ezért szándékosan kikapcsolva:
    # reactive_power_delivered:  # ESPHome: 1-0:3.7.0; mérő: 5.7.0–8.7.0
    #   name: "Pillanatnyi meddő import teljesítmény"
    # reactive_power_returned:   # ESPHome: 1-0:4.7.0; mérő: 5.7.0–8.7.0
