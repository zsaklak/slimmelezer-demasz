name: Ellenőrzés

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python és Home Assistant tesztek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Tesztfüggőségek
        run: >-
          python -m pip install
          homeassistant==2026.8.1
          pytest==9.0.3
          "pytest-asyncio>=1.3,<2"
          pytest-homeassistant-custom-component==0.13.355
          ruff
      - name: Ruff
        run: |
          ruff check custom_components tests scripts
          ruff format --check custom_components tests scripts
      - name: Parser-tesztek
        run: python -m unittest discover -s tests -p 'test_parser.py' -v
      - name: Dokumentációs hivatkozások
        run: python scripts/check_docs.py
      - name: Publikációs szerkezet
        run: python scripts/check_publication.py
      - name: Home Assistant futásidejű teszt
        run: PYTHONPATH=. pytest -q

  esphome:
    name: ESPHome konfiguráció
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: ESPHome telepítése
        run: python -m pip install esphome==2026.7.1
      - name: Teszt-titokfájl létrehozása
        run: cp esphome/secrets.example.yaml esphome/secrets.yaml
      - name: ESPHome-validáció
        run: esphome config esphome/slimmelezer_demasz.yaml

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS-validáció
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
