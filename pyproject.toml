[project]
name = "slimmelezer-demasz"
version = "1.0.1"
description = "Home Assistant és ESPHome támogatás volt Démász területi MVM Sagem MA309M okosmérőkhöz"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.8.1",
  "pytest==9.0.3",
  "pytest-asyncio>=1.3,<2",
  "pytest-homeassistant-custom-component==0.13.355",
  "ruff>=0.12",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
